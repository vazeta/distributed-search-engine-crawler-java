<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Links Relacionados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
            background-color: #f9f9f9;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-right: 20px;
            text-decoration: none;
            cursor: pointer;
        }

        .logo span {
            font-weight: bold;
        }

        form.pesquisa {
            flex-grow: 1;
            display: flex;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 25px 0 0 25px;
            width: 100%;
            max-width: 400px;
        }

        button[type="submit"] {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #1a0dab;
            color: white;
            border: 1px solid #1a0dab;
            border-left: none;
            border-radius: 0 25px 25px 0;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background-color: #0d0080;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .error-message {
            color: red;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .link-card {
            background: white;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid #1a0dab;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            transition: box-shadow 0.2s ease-in-out;
        }

        .link-card:hover {
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .link-card a {
            font-size: 16px;
            font-weight: bold;
            color: #1a0dab;
            text-decoration: none;
            word-break: break-word;
        }

        .link-card a:hover {
            text-decoration: underline;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #1a0dab;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #0d0080;
        }
    </style>
</head>
<body>

<!-- Topo com logotipo e barra de pesquisa -->
<div class="top-bar">
    <a href="/" class="logo">
        <span style="color:#4285F4">G</span>
        <span style="color:#EA4335">o</span>
        <span style="color:#FBBC05">o</span>
        <span style="color:#4285F4">g</span>
        <span style="color:#34A853">o</span>
        <span style="color:#EA4335">l</span>
    </a>

    <form class="pesquisa" th:action="@{/related-links}" method="get">
        <input type="text" name="link" th:value="${link}" placeholder="Digite o link para consultar..." required>
        <button type="submit" title="Buscar">
            <i class="bi bi-search"></i>
        </button>
    </form>
</div>

<h1>Links que apontam para: <span th:text="${link}">Link</span></h1>

<div th:if="${error}" class="error-message">
    <p th:text="${error}"></p>
</div>

<div th:if="${#lists.isEmpty(relatedLinks)}">
    <p>Nenhum link relacionado encontrado.</p>
</div>

<div th:if="${!#lists.isEmpty(relatedLinks)}">
    <div th:each="rlink : ${relatedLinks}" class="link-card">
        <a th:href="${rlink}" th:text="${rlink}" target="_blank" rel="noopener noreferrer"></a>
    </div>
</div>

<div style="margin-top: 30px;">
    <a href="/" class="btn">Voltar à Home</a>
</div>

</body>
</html>
