<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Googol - Motor de Busca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .search-container {
            margin-top: 150px;
            text-align: center;
        }
        .logo {
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .search-form {
            max-width: 600px;
            margin: 0 auto;
        }
        .add-url-container {
            margin-top: 50px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .alert {
            margin-top: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="search-container">
            <div class="logo">Googol</div>
            
            <form class="search-form" action="/search" method="GET">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" name="query" placeholder="Pesquisar..." required>
                    <button class="btn btn-primary" type="submit">Buscar</button>
                </div>
            </form>
            
            <!-- Alerta para mensagens -->
            <div th:if="${message}" class="alert alert-info" role="alert" th:text="${message}"></div>
            <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
        </div>
        
        <div class="add-url-container">
            <div class="card">
                <div class="card-header">
                    Adicionar URL para indexação
                </div>
                <div class="card-body">
                    <form action="/add-url" method="POST">
                        <div class="input-group mb-3">
                            <input type="url" class="form-control" name="url" placeholder="https://..." required>
                            <button class="btn btn-outline-secondary" type="submit">Adicionar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-4">
            <a href="/statistics" class="btn btn-outline-info">Ver Estatísticas do Sistema</a>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
