<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Resultados da pesquisa</title>

    <!-- Bootstrap Icons para a lupa -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-right: 20px;
            cursor: pointer;
            text-decoration: none;
        }

        .logo span {
            font-weight: bold;
        }

        form.pesquisa {
            flex-grow: 1;
            display: flex;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 25px 0 0 25px;
            width: 100%;
            max-width: 400px;
        }

        button[type="submit"] {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #1a0dab;
            color: white;
            border: 1px solid #1a0dab;
            border-left: none;
            border-radius: 0 25px 25px 0;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background-color: #0d0080;
        }

        .resultado {
            margin-bottom: 25px;
        }

        .resultado a.titulo {
            font-size: 18px;
            font-weight: bold;
            color: #1a0dab;
            text-decoration: none;
        }

        .resultado .url {
            font-size: 14px;
            color: #006621;
        }

        .resultado .citacao {
            font-size: 14px;
            color: #545454;
        }

        .paginacao {
            margin-top: 40px;
        }

        .paginacao a {
            margin: 0 5px;
            text-decoration: none;
            color: #1a0dab;
            font-weight: bold;
        }

        .paginacao .pagina-ativa {
            color: black;
            font-weight: bold;
            text-decoration: underline;
        }

        .analise-ia {
            margin-top: 40px;
            padding: 20px;
            background-color: #f1f3f4;
            border-left: 5px solid #1a0dab;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease-in-out;
            margin-bottom: 10px;
        }

        .analise-ia h2 {
            margin-top: 0;
            color: #1a0dab;
            display: flex;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        .analise-ia .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(26, 13, 171, 0.3);
            border-radius: 50%;
            border-top-color: #1a0dab;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="top-bar">
    <!-- Logo com cores estilo Google -->
    <a href="/" class="logo">
        <span style="color:#4285F4">G</span>
        <span style="color:#EA4335">o</span>
        <span style="color:#FBBC05">o</span>
        <span style="color:#4285F4">g</span>
        <span style="color:#34A853">o</span>
        <span style="color:#EA4335">l</span>
    </a>

    <!-- Formulário com lupa -->
    <form class="pesquisa" th:action="@{/search}" method="get">
        <input type="text" name="query" th:value="${query}" placeholder="Pesquisar...">
        <button type="submit" title="Pesquisar">
            <i class="bi bi-search"></i>
        </button>
    </form>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h1 style="margin: 0;">Resultados da pesquisa para: <span th:text="${query}">Pesquisa</span></h1>

    <form action="/hn-index" method="post" style="margin: 0;">
        <input type="hidden" name="query" th:value="${query}">
        <button type="submit"
                style="padding: 8px 16px; background-color: #ffc107; color: black; border: none; border-radius: 5px; cursor: pointer;">
            Indexar Top Stories do Hacker News
        </button>
    </form>
</div>

<!-- Secção de Análise com IA - Melhorada -->
<div class="analise-ia">
    <h2>
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="#1a0dab" viewBox="0 0 16 16" style="margin-right: 8px;">
            <path d="M7.5 1a6.5 6.5 0 0 1 5.152 10.524l1.488 1.488a.5.5 0 0 1-.707.707l-1.488-1.488A6.5 6.5 0 1 1 7.5 1zm0 1a5.5 5.5 0 1 0 0 11A5.5 5.5 0 0 0 7.5 2z"/>
        </svg>
        Análise com IA
        <div id="analysisLoader" class="loading" title="A pensar..."></div>
    </h2>

    <div id="analysisContent" style="margin-top: 10px; padding: 15px; background: white; border-radius: 5px; box-shadow: 0 1px 4px rgba(0,0,0,0.1);">
        A IA está analisando os resultados da sua pesquisa. Por favor, aguarde...
    </div>
</div>

<div th:if="${#lists.isEmpty(results)}">
    <p>Nenhum resultado encontrado.</p>
</div>

<div th:each="res : ${results}" class="resultado">
    <a th:href="${res.link}" th:text="${res.titulo}" class="titulo"></a><br>
    <span class="url" th:text="${res.link}"></span><br>
    <p class="citacao" th:text="${res.citacao}"></p>
</div>

<div class="paginacao" th:if="${pages > 1}">
    <span th:each="i : ${#numbers.sequence(1, pages)}">
        <a th:if="${i != currentPage}"
           th:href="@{/search(query=${query}, page=${i})}"
           th:text="${i}"></a>
        <span th:if="${i == currentPage}" th:text="${i}" class="pagina-ativa"></span>
    </span>
</div>

<!-- Scripts WebSocket -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:inline="javascript">
    var queryId = /*[[${queryId}]]*/ '';

    var socket = new SockJS('/ws');
    var stompClient = Stomp.over(socket);

    stompClient.connect({}, function(frame) {
        console.log('Conectado: ' + frame);

        stompClient.subscribe('/topic/analysis/' + queryId, function(response) {
            var analysisText = response.body;
            document.getElementById('analysisContent').textContent = analysisText;

            if (!analysisText.includes("Analisando resultados...") && !analysisText.includes("aguarde")) {
                document.getElementById('analysisLoader').classList.add('hidden');
            }
        });
    }, function(error) {
        console.error('Erro na conexão WebSocket: ' + error);
        document.getElementById('analysisContent').textContent = 'Não foi possível conectar ao serviço de análise.';
        document.getElementById('analysisLoader').classList.add('hidden');
    });
</script>

</body>
</html>
